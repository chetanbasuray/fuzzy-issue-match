name: Duplicate benchmark

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run benchmark -- --dataset benchmark/dataset.json --thresholds 0.3,0.5,0.7 --check-baseline benchmark/baseline.json --min-f1 0
